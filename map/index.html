<title>Hearthlight Guildhall Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#0b0e10;--panel:#14191c;--ink:#e8e2d2;--mute:#98a29e;--line:#2c3539;--accent:#dba54d;--blood:#e0675d;--f-d:'Cinzel',Georgia,serif;--f-b:'Source Sans 3',system-ui,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.35 var(--f-b);overflow:hidden;margin:0;padding:0}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--bg)}
#map.drag{cursor:grabbing}
#bar{position:absolute;left:0;right:0;top:0;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:rgba(15,19,22,.93);border-bottom:1px solid var(--line);z-index:5}
#bar h1{font:700 15px var(--f-d);letter-spacing:.08em;margin:0;color:var(--accent);flex:0 0 auto}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.lab{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
button,select,input{font:inherit;color:var(--ink);background:#1d2428;border:1px solid var(--line);border-radius:6px;padding:5px 10px;min-height:32px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#1a1409;border-color:var(--accent);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:64px}input[type=text]{width:120px}input[type=color]{width:38px;padding:2px}
#sel{display:none}#sel.show{display:flex}
#show{position:absolute;right:12px;top:12px;z-index:6;display:none;opacity:.55}
#show:hover{opacity:1}
#ruler{position:absolute;left:16px;bottom:16px;z-index:4;display:none;pointer-events:none}
#ruler b{display:block;height:10px;border:2px solid var(--accent);border-top:0;box-sizing:border-box}
#ruler span{display:block;margin-top:4px;font-size:12px;color:var(--accent);text-shadow:0 0 4px #000;white-space:nowrap}
#note{position:absolute;right:16px;bottom:16px;z-index:4;max-width:min(360px,calc(100% - 32px));font-size:12px;color:var(--mute);background:rgba(15,19,22,.85);padding:6px 10px;border-radius:6px;pointer-events:none}
.gmflag{color:var(--blood);font:700 12px var(--f-d);letter-spacing:.1em;border:1px solid var(--blood);border-radius:4px;padding:3px 8px}
svg text{font-family:var(--f-d);pointer-events:none}
.tok{cursor:move}
@media (max-width:560px){#bar h1{flex-basis:100%}}
</style>
